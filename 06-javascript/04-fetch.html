<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript Exercise 04 - Fetch</title>
    <link rel="stylesheet" href="04-fetch.css" />
    <script defer src="04-fetch.js"></script>
  </head>

  <body>
    <header class="header">
      <h1 class="brand-logo">Pokedex</h1>
      <nav>
        <search>
          <form action="/search">
            <input
              class="search-bar"
              type="search"
              value="Search Pokemon..."
              id="navbar"
              aria-label="Search Pokemon..."
            />
          </form>
        </search>
      </nav>
    </header>
    <main>
      <section class="container">
        <div class="loading-container">
          <!-- Use the loader.gif provided in the images/ folder -->
          <img
            src="../images/loader.gif"
            alt="loader gif while the data loads"
            width="40"
            height="60"
          />
          <p class="loading">Fetching data...</p>
        </div>
        <div class="poke-list"></div>
      </section>
    </main>
  </body>
</html>
